# Nginx config para fcat.cl
# Copiar a: /etc/nginx/sites-available/fcat
# Activar con: ln -s /etc/nginx/sites-available/fcat /etc/nginx/sites-enabled/fcat
# Luego: nginx -t && systemctl reload nginx
#
# NOTA: Los bloques SSL son generados por Certbot. Ejecutar primero:
#   certbot --nginx -d fcat.cl -d www.fcat.cl
# Certbot completará/reemplazará las líneas ssl_* automáticamente.

server {
    listen 80;
    server_name fcat.cl www.fcat.cl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name fcat.cl www.fcat.cl;

    # SSL — completado por Certbot
    ssl_certificate /etc/letsencrypt/live/fcat.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fcat.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Límite de tamaño para uploads (igual que multer: 200 MB)
    client_max_body_size 200M;

    # Proxy al servidor Node.js
    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
